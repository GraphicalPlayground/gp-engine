name: 'Setup Graphical Playground Dependencies'
description: 'Caches CMake FetchContent dependencies and installs heavy system SDKs.'

inputs:
  os:
    description: 'The runner OS (e.g., ubuntu-latest, windows-latest)'
    required: true
  build-dir:
    description: 'The CMake build directory'
    required: false
    default: 'build'

runs:
  using: "composite"
  steps:
    - name: Install Linux Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        chmod +x ./toolchain/dependencies/ubuntu-debian.sh
        bash ./toolchain/dependencies/ubuntu-debian.sh

    - name: Install macOS Dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Apple Clang, Metal, and OpenGL are pre-installed via Xcode CLI tools.
        # We just need to install Ninja.
        brew install ninja

    - name: Install Windows Dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Windows SDK (D3D11/D3D12) is pre-installed on GitHub runners.
        # We need LLVM/Clang and Ninja.
        choco install llvm ninja -y

    - name: Enforce Clang for CMake on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        # Exporting CC and CXX environment variables tells CMake to use Clang 
        # instead of defaulting to GCC (Linux).
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV

    - name: Enforce Clang-cl for CMake on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # On Windows, we want to use clang-cl to ensure compatibility with the Windows SDK.
        echo "CC=clang-cl" >> $GITHUB_ENV
        echo "CXX=clang-cl" >> $GITHUB_ENV
