name: Synchronize Source of Truth

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  synchronize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},gp-source-of-truth

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Synchronize Source of Truth
        uses: GraphicalPlayground/gp-source-of-truth@ms/new-template-system
        with:
          source-repository: 'GraphicalPlayground/gp-source-of-truth'
          source-branch: 'ms/new-template-system'
          source-token: ${{ steps.app-token.outputs.token }}
          target-repository: ${{ github.repository }}
          target-branch: 'main'
          target-token: ${{ steps.app-token.outputs.token }}
          bot-name: '${{ steps.app-token.outputs.app-slug }}[bot]'
          bot-email: '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
